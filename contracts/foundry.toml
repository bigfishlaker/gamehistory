[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1024

[profile.ci.fuzz]
runs = 10000

[rpc_endpoints]
grotto = "https://subnets.avax.network/thegrotto/mainnet/rpc"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110
